<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leonardo | Editor de Vídeo</title>
<meta name="description" content="Portfólio de Leonardo, editor de vídeo para Youtubers.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --text:#ffffff;
    --text-dim:rgba(255,255,255,.62);
    --text-faint:rgba(255,255,255,.36);
    --border:rgba(255,255,255,.14);
    --border-soft:rgba(255,255,255,.08);
    --surface:rgba(255,255,255,.03);
    --surface-hover:rgba(255,255,255,.08);
    --dot:rgba(255,255,255,.17);
    --radius-lg:26px;
    --maxw:1080px;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background-color:var(--bg);
    background-image:radial-gradient(circle, var(--dot) 1.1px, transparent 1.6px);
    background-size:26px 26px;
    color:var(--text);
    font-family:'Quicksand','Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  ::selection{ background:rgba(255,255,255,.25); }
  :focus-visible{ outline:2px solid #fff; outline-offset:3px; border-radius:6px; }
  img{ max-width:100%; display:block; }

  .wrap{
    max-width:var(--maxw);
    margin:0 auto;
    padding:clamp(40px,7vw,72px) 24px 56px;
  }

  /* ---------- HERO ---------- */
  .hero{
    display:flex;
    align-items:center;
    gap:22px;
    margin-bottom:clamp(56px,9vw,88px);
    position:relative;
    animation:heroIn .7s ease-out;
  }
  @keyframes heroIn{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .hero::before{
    content:"";
    position:absolute;
    left:-36px; top:50%;
    width:220px; height:220px;
    background:radial-gradient(circle, rgba(255,255,255,.10), transparent 70%);
    transform:translateY(-50%);
    pointer-events:none;
  }
  .avatar{
    position:relative;
    width:86px; height:86px;
    flex-shrink:0;
    border-radius:50%;
    overflow:hidden;
    border:1px solid var(--border);
    background:#0c0c0c;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .avatar .initials{
    font-weight:700;
    font-size:26px;
    color:var(--text-dim);
  }
  .identity{ position:relative; }
  .identity h1{
    margin:0;
    font-weight:700;
    font-size:clamp(22px,4vw,30px);
    line-height:1.15;
  }
  .identity h1 .divider{
    color:var(--text-faint);
    font-weight:500;
    margin:0 10px;
  }
  .identity p{
    margin:8px 0 0;
    font-weight:500;
    font-size:15px;
    color:var(--text-dim);
  }

  /* ---------- SECTIONS ---------- */
  section{ margin-bottom:clamp(44px,7vw,64px); }
  .section-title{
    font-size:15px;
    font-weight:600;
    color:var(--text-dim);
    margin:0 0 18px;
  }

  .grid{
    display:grid;
    gap:18px;
    grid-template-columns:repeat(3,1fr);
  }
  @media (max-width:760px){ .grid{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:560px){
    .grid{ grid-template-columns:1fr; }
    .grid .card.square{ aspect-ratio:16/9; }
    .hero{ gap:16px; }
    .avatar{ width:68px; height:68px; }
  }

  .grid.shorts{
    grid-template-columns:repeat(3,1fr);
    max-width:600px;
    margin:0 auto;
  }
  @media (max-width:640px){ .grid.shorts{ grid-template-columns:repeat(2,1fr); max-width:420px; } }
  @media (max-width:420px){ .grid.shorts{ grid-template-columns:1fr; max-width:230px; } }

  .card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius-lg);
    overflow:hidden;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .card.square{ aspect-ratio:1/1; }
  .card.vertical{ aspect-ratio:9/16; }

  .frame-16-9{ position:relative; width:100%; aspect-ratio:16/9; }
  .frame-fill{ position:absolute; inset:0; }
  iframe{ position:absolute; inset:0; width:100%; height:100%; border:0; }

  /* ---------- CONTACT ---------- */
  .contact{
    display:flex;
    justify-content:center;
    gap:16px;
    margin-bottom:26px;
  }
  .social{
    width:52px; height:52px;
    border-radius:50%;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--text);
    text-decoration:none;
    cursor:pointer;
    transition:background .18s ease, transform .18s ease;
  }
  .social:hover{ background:var(--surface-hover); transform:translateY(-2px); }
  .social svg{ width:20px; height:20px; }

  footer{
    text-align:center;
    color:var(--text-faint);
    font-size:13px;
    font-weight:500;
  }

  /* ---------- MODAL ---------- */
  .modal-overlay{
    position:fixed; inset:0;
    background:rgba(0,0,0,.72);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    position:relative;
    background:#0a0a0a;
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:30px 26px 26px;
    max-width:320px;
    width:100%;
    text-align:center;
  }
  .modal h3{ margin:0 0 6px; font-size:18px; font-weight:700; }
  .modal .hint{ margin:0 0 20px; font-size:13px; font-weight:500; color:var(--text-dim); }
  .copy-row{
    display:flex;
    align-items:center;
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:14px;
    padding:12px 16px;
    margin-bottom:14px;
  }
  .copy-row span{
    font-family:'Courier New',monospace;
    font-size:14px;
    color:var(--text);
  }
  .copy-btn{
    width:100%;
    background:#fff;
    color:#000;
    border:none;
    border-radius:12px;
    padding:12px 16px;
    font-family:inherit;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    transition:opacity .15s ease;
  }
  .copy-btn:hover{ opacity:.85; }
  .close-btn{
    position:absolute;
    top:14px; right:14px;
    width:28px; height:28px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:none;
    border:none;
    color:var(--text-dim);
    font-size:20px;
    cursor:pointer;
  }

  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>

<script>
(function(){
  var modal = document.getElementById('discordModal');
  var openBtn = document.getElementById('discordBtn');
  var closeBtn = document.getElementById('closeModal');
  var copyBtn = document.getElementById('copyBtn');
  var username = 'leonardo.edicao';

  function openModal(){ modal.classList.add('open'); }
  function closeModal(){ modal.classList.remove('open'); }

  openBtn.addEventListener('click', openModal);
  closeBtn.addEventListener('click', closeModal);
  modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });

  copyBtn.addEventListener('click', async function(){
    try{
      await navigator.clipboard.writeText(username);
    }catch(err){
      try{
        var ta = document.createElement('textarea');
        ta.value = username;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.focus(); ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }catch(e2){}
    }
    var original = copyBtn.textContent;
    copyBtn.textContent = 'Copiado!';
    setTimeout(function(){ copyBtn.textContent = original; }, 1800);
  });
})();
</script>
